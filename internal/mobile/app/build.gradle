plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'com.chaquo.python'
}

// 复验/联调可临时抬高版本号打一个升级包（-PapkVersionCode / -PapkVersionName），不必改死代码。
def apkVersionCodeOverride = project.findProperty('apkVersionCode')
def apkVersionNameOverride = project.findProperty('apkVersionName')
// ---- 足球直播 Release 入口门槛（OTV-RELEASE-ORIGIN-GATE-BEGIN）----------------
// TV 版与移动版必须使用逐字节相同的一段规则与同一套报错文案；对称性由
// tools/tests/test_release_api_origin_contract.py 断言，改动必须同步两处。
// 正式包：必须显式传入已验收的正式域名 -PapiBaseUrl=https://<正式域名>
// （或环境变量 OTV_RELEASE_API_BASE_URL），缺省立即 fail fast。
// 入口只接受纯 origin（结尾斜杠会被 normalize 去掉），热更新端点由 /hotupdate
// 等固定路径拼接而成，所以任何路径都视为错误输入。
// 迁移 CA + IP 入口：默认仍只允许 Debug 本机联调，正式包一律拒绝。
// 无正式域名的自建 VPS（103.236.97.137:35208）要出正式包，必须显式双重 opt-in：
//   -PallowIpReleaseOrigin=true（或环境变量 OTV_ALLOW_IP_RELEASE_ORIGIN=true）
// 且 apiBaseUrl 恰好等于该迁移 origin。此时才把 src/ipRelease/res 挂进 release 变体，
// 由同名资源为这一个 IP 信任迁移 CA（@raw/mytv_migration_ca），其余域名仍只信任系统 CA。
def otvMigrationTestOrigin = 'https://103.236.97.137:35208'
// 显式 opt-in 才允许 IP 入口进正式包；缺省 false 时行为与旧门槛完全一致。
def otvIpReleaseOptIn = ((project.findProperty('allowIpReleaseOrigin') ?:
        System.getenv('OTV_ALLOW_IP_RELEASE_ORIGIN'))?.toString()?.trim()?.toLowerCase() == 'true')
def otvApiOriginProblem = { String otvUrl ->
    if (!otvUrl) {
        return '未显式传入正式 API 入口：Release 必须使用 -PapiBaseUrl=https://<正式域名>（或环境变量 OTV_RELEASE_API_BASE_URL）'
    }
    if (otvUrl == otvMigrationTestOrigin || otvUrl == otvMigrationTestOrigin + '/') {
        if (!otvIpReleaseOptIn) {
            return "拒绝迁移 CA / IP 测试入口：${otvUrl}（正式包必须使用已验收的正式域名与公共 CA 证书；" +
                    '仅在无正式域名、明确接受自建 VPS 入口时才加 -PallowIpReleaseOrigin=true）'
        }
        return null
    }
    if (otvUrl.startsWith(otvMigrationTestOrigin + '/')) {
        // 带路径的迁移 origin 不是纯 origin，一律按「不得包含路径」处理；
        // opt-in 不豁免这一条，避免把 IP 入口变成任意路径前缀。
        return "Release 入口不得包含路径：${otvUrl}（IP 入口的 opt-in 只放行纯 origin ${otvMigrationTestOrigin}）"
    }
    def otvUri
    try {
        otvUri = java.net.URI.create(otvUrl)
    } catch (Exception otvIgnored) {
        return "apiBaseUrl 不是合法 URL：${otvUrl}"
    }
    if (otvUri.scheme != 'https') {
        return "Release 入口必须是 https://：${otvUrl}"
    }
    if (otvUri.userInfo) {
        return "Release 入口不得包含 userinfo：${otvUrl}"
    }
    if (otvUri.query) {
        return "Release 入口不得包含 query：${otvUrl}"
    }
    if (otvUri.fragment) {
        return "Release 入口不得包含 fragment：${otvUrl}"
    }
    def otvHost = otvUri.host ?: ''
    if (!otvHost) {
        return "Release 入口缺少 host：${otvUrl}"
    }
    if (otvHost ==~ /\d{1,3}(\.\d{1,3}){3}/ || otvHost.contains(':')) {
        return "Release 入口不得使用 IP 字面量：${otvUrl}（除已 opt-in 的自建 VPS ${otvMigrationTestOrigin} 外，IP 只允许 Debug 本机联调）"
    }
    if (!(otvHost ==~ /(?i)(?!-)[a-z0-9-]{1,63}(\.[a-z0-9-]{1,63})*\.[a-z]{2,}$/)) {
        return "Release 入口必须使用已备案的正式域名：${otvUrl}"
    }
    if (!(otvUri.path in ['', '/'])) {
        return "Release 入口不得包含路径：${otvUrl}（直播端点由构建配置派生）"
    }
    return null
}
// IDE 同步等无 task 名的场景 taskNames 为空，此时不按 Release 处理，避免配置期被拦。
def otvReleaseRequested = gradle.startParameter.taskNames.any { String otvTaskName ->
    def otvLower = otvTaskName.toLowerCase()
    otvLower.contains('release') || otvLower in ['assemble', 'build', 'install']
}
def otvConfiguredApiBaseUrl = (project.findProperty('apiBaseUrl') ?: System.getenv('OTV_RELEASE_API_BASE_URL'))?.toString()?.trim()
def apiBaseUrl
if (otvReleaseRequested) {
    def otvProblem = otvApiOriginProblem(otvConfiguredApiBaseUrl)
    if (otvProblem) {
        throw new GradleException("足球直播 Release 入口门槛未通过：${otvProblem}")
    }
    apiBaseUrl = otvConfiguredApiBaseUrl.replaceAll('/+$', '')
} else {
    apiBaseUrl = (otvConfiguredApiBaseUrl ?: otvMigrationTestOrigin).replaceAll('/+$', '')
}
def apiBaseUrlConstant = '"' + apiBaseUrl + '"'
// ---- 足球直播 Release 入口门槛（OTV-RELEASE-ORIGIN-GATE-END）------------------
def releaseStorePassword = project.findProperty('OTV_RELEASE_STORE_PASSWORD') ?: System.getenv('OTV_RELEASE_STORE_PASSWORD') ?: ''
def releaseKeyPassword = project.findProperty('OTV_RELEASE_KEY_PASSWORD') ?: System.getenv('OTV_RELEASE_KEY_PASSWORD') ?: ''

android {
    namespace 'com.qiubo.optimaltv'
    compileSdk 35
    testOptions { unitTests.includeAndroidResources = true }

    // 无正式域名的 IP 入口：只有显式 opt-in 时，才把迁移 CA 信任配置挂进 release 变体。
    // 不传开关时这个目录完全不参与资源合并，正式域名发布包因此不会打进私有 CA 信任锚。
    if (otvIpReleaseOptIn) {
        sourceSets.release.res.srcDir 'src/ipRelease/res'
    }

    defaultConfig {
        // 移动版（手机/平板触屏）：与 TV 版同命名空间、不同 applicationId，
        // 可与 TV 版同设备共存、数据互相隔离。
        // v1.19 版本重规划（2026-09-03）：只保留原公测移动一条线，命名「移动版」；
        // 包名沿用公测移动 com.qiubo.optimaltv.mobile.public——老公测用户直接覆盖升级
        applicationId "com.qiubo.optimaltv.mobile.public"
        // 版本号与 TV 版保持同步（同一套版本基线，见 tools/sync_shared.py）
        minSdk 30
        targetSdk 34
        // v1.19：竖屏自适应解锁（总体#2），横屏仍与 TV 版同款 1920 设计稿
        // 2026-09-16：足球比赛列表和信号源解析优化。
        // v1.32（2026-09-16）：云端接口从 Sites 切回腾讯云 CloudBase（国内可直连）。
    // v1.34（2026-09-21）：APK 应用内更新支持分片下载——对象桶单对象硬上限 100 MiB，
    // 大包按 < 100 MiB 拆段，客户端按序下载拼成整包后仍校验 SHA-256 与签名证书。
    // v1.35（2026-09-21）：长按画面左右两侧 = 3.0x 倍速播放；并含播放器渲染层 key
    // 失配修复（黑屏只剩声音 / 错误卡弹窗后音频仍响 / 切信号源无效）。
    // v1.36（2026-09-22）：「我的」页新增「检查更新」手动入口（手动检查忽略「稍后更新」记忆）。
    // ---- 版本号规则（2026-09-22 重置；各渠道按各自已发布版本递增）----
    // 用户要求：APK 版本与更新记录清零，从 V1.0 重新开始，之后每版 +0.1。
    //   versionName = V1.0 / V1.1 / V1.2 …（界面展示用）
    //   versionCode = 主版本×100 + 次版本×10 → V1.0=100、V1.1=110、V1.2=120、V2.0=200
    // 必须严格递增：客户端只比较 versionCode，系统安装也不允许降级覆盖。V1.0 取 100
    // 而非 10，是为了高于重置前的 42，已装 1.4x 的设备仍能收到 V1.0 的更新提示。
    versionCode(apkVersionCodeOverride ? Integer.parseInt(apkVersionCodeOverride.toString()) : 278)
    versionName(apkVersionNameOverride ? apkVersionNameOverride.toString() : "2.7.8")
        // 与 TV 版一致的三 ABI（Chaquopy/libVLC so 需要）；移动版无 cpp 拼音解码器
        ndk { abiFilters "arm64-v8a", "armeabi-v7a", "x86_64" }

        // v1.19 版本重规划：内测/公测双 flavor 退役——只保留原公测移动一条线。
        // 热更新与 TV 版共用，用于内嵌后端的启动维护。
        // TV 与移动客户端统一显示「足球直播」；归档文件名按设备类型区分。
        // 注意：两端 label 相同，故**同一台设备不要同时装 TV 版与移动版**（靠 applicationId
        // 可以共存，但桌面会出现两个同名图标），分发时按设备类型二选一。
        resValue 'string', 'app_name', '足球直播'
        // 足球比赛列表可直接访问，不设置内容准入门禁。
        buildConfigField 'String', 'API_BASE_URL', apiBaseUrlConstant
        buildConfigField 'boolean', 'HOTUPDATE_ENABLED', 'true'
        buildConfigField 'String', 'HOTUPDATE_ENDPOINT', '"' + apiBaseUrl + '/hotupdate"'
        // APK 应用内更新清单；发布时将对应清单放到静态站点的 apk-update/ 目录。
        // 联调/自测可用 -PapkUpdateUrl=<https 地址> 临时指向测试清单，不必改死代码。
        buildConfigField 'boolean', 'APK_UPDATE_ENABLED', 'true'
        buildConfigField 'String', 'APK_UPDATE_URL',
                '"' + (project.findProperty('apkUpdateUrl') ?: (apiBaseUrl + '/web/apk-update/mobile.json')) + '"'

        // 移动端组件级仪器测试使用轻量 Application，避免测试启动内嵌后端；
        // 业务组件仍由 debug harness 原生渲染。
        testInstrumentationRunner 'com.qiubo.optimaltv.mobileui.MobileUiTestRunner'
    }


    signingConfigs {
        release {
            // 发布签名与 TV 版同一把（10 年有效期；两版本可共存安装）
            storeFile file("../optimaltv-release.keystore")
            storePassword releaseStorePassword
            keyAlias "optimaltv"
            keyPassword releaseKeyPassword
            // v1.39（2026-09-22）：与 TV 版同步补 v1 签名（minSdk 30 时 AGP 默认
            // 只出 v2）；部分定制 ROM 读不了 v2-only 包，v1+v2 双签是兼容底线。
            // 签名证书不变，已装版本可直接覆盖升级。
            enableV1Signing = true
            enableV2Signing = true
            v1SigningEnabled = true
            v2SigningEnabled = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false   // Chaquopy + 反射（引擎/Room）保守不混淆
            signingConfig signingConfigs.release
        }
        debug {
            // v1.20 QA：debug 也用发布签名（同 TV 版）——可覆盖安装 release 保数据
            signingConfig signingConfigs.release
            // Debug 必须验证 APK 内嵌的当前后端；不要让线上热更新覆盖本地测试代码。
            buildConfigField 'boolean', 'HOTUPDATE_ENABLED', 'false'
        }
    }

    buildFeatures { compose true; buildConfig true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.14' }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    packagingOptions {
        resources { excludes += ['META-INF/{AL2.0,LGPL2.1}'] }
        // libVLC 三 ABI so 压缩打包（与 TV 版同策略）
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

// 后端打包进 app：Chaquopy 配置（与 TV 版字节级一致，见 sync_shared.py 同步清单）
chaquopy {
    defaultConfig {
        version = "3.11"
    }
}

// 统一产物到项目目录：apk/移动版/ 固定名 FootballLive-Mobile.apk，
// 由 assembleRelease 复制（对外分发=签名+热更新正式链路）。
// debug 测试包不进 apk/——直接用项目根 build 构建输出目录。
tasks.register("copyMobileApk", Copy) {
    from(layout.buildDirectory.file("outputs/apk/release/app-release.apk"))
    into(rootProject.file("../../apk/移动版"))
    rename { "FootballLive-Mobile.apk" }
}
// AGP 的 assemble 任务在 android 插件注册后才出现，须在 afterEvaluate 挂接依赖
afterEvaluate {
    tasks.matching { it.name == "assembleRelease" }.configureEach { finalizedBy("copyMobileApk") }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.06.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.3'
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // 播放引擎层：与 TV 版完全一致（Media3 默认 + libVLC 兜底三段回退）
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation 'androidx.media3:media3-datasource:1.5.1'
    implementation 'org.videolan.android:libvlc-all:3.7.2'

    // 数据层：Room 三表 + DataStore KV（与 TV 版一致）
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // 图片：Coil 双缓存 + SVG 队标解码（与 TV 版一致）
    implementation 'io.coil-kt:coil-compose:2.6.0'
    implementation 'io.coil-kt:coil-svg:2.6.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'

    // 移动端 Compose 组件级自动化测试。
    androidTestImplementation composeBom
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
