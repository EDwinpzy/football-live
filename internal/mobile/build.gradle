// 优化版根构建脚本：AGP 8.7.0 / Kotlin 1.9.24（本机已验证组合）
plugins {
    id 'com.android.application' version '8.7.0' apply false
    id 'com.android.library' version '8.7.0' apply false
    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
    // 后端打包进 app：Chaquopy（Python 运行时，跑 proxy.py），版本与原版壳一致
    id 'com.chaquo.python' version '16.1.0' apply false
}

// 构建缓存移到项目根目录，源码与构建产物分开。
// 注意：目录必须与 TV 工程（build/zuo-live）分开，两工程共用目录会互相清空中间产物。
// （2026-09-02 实测：双工程同时 assembleRelease → R 资源假性 Unresolved / 构建缓存损坏）
allprojects {
    // 目录同样必须跟随当前 checkout，否则 worktree 构建会污染主工作树
    buildDir = new File(rootDir, "build/zuo-live-mobile/${project.name}")
}
