plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'com.chaquo.python'
}

// 复验/联调可临时抬高版本号打一个升级包（-PapkVersionCode / -PapkVersionName），不必改死代码。
def apkVersionCodeOverride = project.findProperty('apkVersionCode')
def apkVersionNameOverride = project.findProperty('apkVersionName')
// ---- My TV Release 入口门槛（OTV-RELEASE-ORIGIN-GATE-BEGIN）----------------
// TV 版与移动版必须使用逐字节相同的一段规则与同一套报错文案；对称性由
// tools/tests/test_release_api_origin_contract.py 断言，改动必须同步两处。
// 正式包：必须显式传入已验收的正式域名 -PapiBaseUrl=https://<正式域名>
// （或环境变量 OTV_RELEASE_API_BASE_URL），缺省立即 fail fast。
// 入口只接受纯 origin（结尾斜杠会被 normalize 去掉），端点由 /activate、/hotupdate
// 等固定路径拼接而成，所以任何路径都视为错误输入。
// 迁移 CA + IP 入口：默认仍只允许 Debug 本机联调，正式包一律拒绝。
// 无正式域名的自建 VPS（103.236.97.137:35208）要出正式包，必须显式双重 opt-in：
//   -PallowIpReleaseOrigin=true（或环境变量 OTV_ALLOW_IP_RELEASE_ORIGIN=true）
// 且 apiBaseUrl 恰好等于该迁移 origin。此时才把 src/ipRelease/res 挂进 release 变体，
// 由同名资源为这一个 IP 信任迁移 CA（@raw/mytv_migration_ca），其余域名仍只信任系统 CA。
def otvMigrationTestOrigin = 'https://103.236.97.137:35208'
// 显式 opt-in 才允许 IP 入口进正式包；缺省 false 时行为与旧门槛完全一致。
def otvIpReleaseOptIn = ((project.findProperty('allowIpReleaseOrigin') ?:
        System.getenv('OTV_ALLOW_IP_RELEASE_ORIGIN'))?.toString()?.trim()?.toLowerCase() == 'true')
def otvApiOriginProblem = { String otvUrl ->
    if (!otvUrl) {
        return '未显式传入正式 API 入口：Release 必须使用 -PapiBaseUrl=https://<正式域名>（或环境变量 OTV_RELEASE_API_BASE_URL）'
    }
    if (otvUrl == otvMigrationTestOrigin || otvUrl == otvMigrationTestOrigin + '/') {
        if (!otvIpReleaseOptIn) {
            return "拒绝迁移 CA / IP 测试入口：${otvUrl}（正式包必须使用已验收的正式域名与公共 CA 证书；" +
                    '仅在无正式域名、明确接受自建 VPS 入口时才加 -PallowIpReleaseOrigin=true）'
        }
        return null
    }
    if (otvUrl.startsWith(otvMigrationTestOrigin + '/')) {
        // 带路径的迁移 origin 不是纯 origin，一律按「不得包含路径」处理；
        // opt-in 不豁免这一条，避免把 IP 入口变成任意路径前缀。
        return "Release 入口不得包含路径：${otvUrl}（IP 入口的 opt-in 只放行纯 origin ${otvMigrationTestOrigin}）"
    }
    def otvUri
    try {
        otvUri = java.net.URI.create(otvUrl)
    } catch (Exception otvIgnored) {
        return "apiBaseUrl 不是合法 URL：${otvUrl}"
    }
    if (otvUri.scheme != 'https') {
        return "Release 入口必须是 https://：${otvUrl}"
    }
    if (otvUri.userInfo) {
        return "Release 入口不得包含 userinfo：${otvUrl}"
    }
    if (otvUri.query) {
        return "Release 入口不得包含 query：${otvUrl}"
    }
    if (otvUri.fragment) {
        return "Release 入口不得包含 fragment：${otvUrl}"
    }
    def otvHost = otvUri.host ?: ''
    if (!otvHost) {
        return "Release 入口缺少 host：${otvUrl}"
    }
    if (otvHost ==~ /\d{1,3}(\.\d{1,3}){3}/ || otvHost.contains(':')) {
        return "Release 入口不得使用 IP 字面量：${otvUrl}（除已 opt-in 的自建 VPS ${otvMigrationTestOrigin} 外，IP 只允许 Debug 本机联调）"
    }
    if (!(otvHost ==~ /(?i)(?!-)[a-z0-9-]{1,63}(\.[a-z0-9-]{1,63})*\.[a-z]{2,}$/)) {
        return "Release 入口必须使用已备案的正式域名：${otvUrl}"
    }
    if (!(otvUri.path in ['', '/'])) {
        return "Release 入口不得包含路径：${otvUrl}（端点由 /activate、/hotupdate 等固定路径组成）"
    }
    return null
}
// IDE 同步等无 task 名的场景 taskNames 为空，此时不按 Release 处理，避免配置期被拦。
def otvReleaseRequested = gradle.startParameter.taskNames.any { String otvTaskName ->
    def otvLower = otvTaskName.toLowerCase()
    otvLower.contains('release') || otvLower in ['assemble', 'build', 'install']
}
def otvConfiguredApiBaseUrl = (project.findProperty('apiBaseUrl') ?: System.getenv('OTV_RELEASE_API_BASE_URL'))?.toString()?.trim()
def apiBaseUrl
if (otvReleaseRequested) {
    def otvProblem = otvApiOriginProblem(otvConfiguredApiBaseUrl)
    if (otvProblem) {
        throw new GradleException("My TV Release 入口门槛未通过：${otvProblem}")
    }
    apiBaseUrl = otvConfiguredApiBaseUrl.replaceAll('/+$', '')
} else {
    apiBaseUrl = (otvConfiguredApiBaseUrl ?: otvMigrationTestOrigin).replaceAll('/+$', '')
}
def apiBaseUrlConstant = '"' + apiBaseUrl + '"'
// ---- My TV Release 入口门槛（OTV-RELEASE-ORIGIN-GATE-END）------------------
def releaseStorePassword = project.findProperty('OTV_RELEASE_STORE_PASSWORD') ?: System.getenv('OTV_RELEASE_STORE_PASSWORD') ?: ''
def releaseKeyPassword = project.findProperty('OTV_RELEASE_KEY_PASSWORD') ?: System.getenv('OTV_RELEASE_KEY_PASSWORD') ?: ''

android {
    namespace 'com.qiubo.optimaltv'
    compileSdk 35
    testOptions { unitTests.includeAndroidResources = true }

    // 无正式域名的 IP 入口：只有显式 opt-in 时，才把迁移 CA 信任配置挂进 release 变体。
    // 不传开关时这个目录完全不参与资源合并，正式域名发布包因此不会打进私有 CA 信任锚。
    if (otvIpReleaseOptIn) {
        sourceSets.release.res.srcDir 'src/ipRelease/res'
    }

    defaultConfig {
        // v1.19 版本重规划（2026-09-03）：只保留原公测版一条线，命名「TV 版」。
        // 包名沿用公测版 com.qiubo.optimaltv.public——老公测用户直接覆盖升级
        applicationId "com.qiubo.optimaltv.public"
        // 技术方案 §4.2：坚果 N1 Air = Bonfire OS / Android 11 → minSdk 30，零 GMS 依赖
    minSdk 30
    targetSdk 34
    // v1.25（2026-09-13）：授权协议 v2，统一到期时间与 24 小时网络宽限
    // v1.27（2026-09-15）：影视三栏恒空 / 豆瓣海报 418 / 今日比赛滤掉亚冠 / 详情页超时 修复批
    // v1.28（2026-09-16）：重装免重激活（设备维度恢复）+ 激活失败保留真实 HTTP 状态并重试一次
    // v1.29（2026-09-16）：影视源全通修复批——源匹配失败重试 / 代理 fake-IP 放行 /
    //                      探测预算收敛 / 豆瓣海报 Referer 与占位图兜底（热更 v21 同源）
    // v1.32（2026-09-16）：云端接口从 Sites 切回腾讯云 CloudBase（国内可直连）。
    // 2026-10-11：按用户要求，所有变体关闭内容准入门禁；会员/激活功能仍可主动访问。
    // v1.34（2026-09-21）：APK 应用内更新支持分片下载——对象桶单对象硬上限 100 MiB，
    // 大包按 < 100 MiB 拆段，客户端按序下载拼成整包后仍校验 SHA-256 与签名证书。
    // v1.35（2026-09-21）：移动端长按画面左右两侧 = 3.0x 倍速播放（网页版同款、仅触屏）；
    // 并含播放器渲染层 key 失配修复（黑屏只剩声音 / 错误卡弹窗后音频仍响 / 切信号源无效）。
    // v1.36（2026-09-22）：「我的」页新增「检查更新」手动入口（手动检查忽略「稍后更新」记忆）。
    // ---- 版本号规则（2026-09-22 重置）----
    // 用户要求：APK 版本与更新记录清零，从 V1.0 重新开始，之后每版 +0.1。
    //   versionName = V1.0 / V1.1 / V1.2 …（界面展示用）
    //   versionCode = 主版本×100 + 次版本×10 → V1.0=100、V1.1=110、V1.2=120、V2.0=200
    // 必须严格递增：客户端 ApkUpdatePolicy 只比较 versionCode（manifest.versionCode
    // <= 本机 versionCode 即视为无更新），系统安装也不允许降级覆盖。V1.0 取 100 而不是
    // 10，是为了同时高于重置前的 42，已装 1.4x 的设备仍能收到 V1.0 的更新提示。
    versionCode(apkVersionCodeOverride ? Integer.parseInt(apkVersionCodeOverride.toString()) : 316)
    versionName(apkVersionNameOverride ? apkVersionNameOverride.toString() : "3.0.6")
        // 方案 §5：双 ABI split 思路——真机 arm64/v7a + 模拟器 x86_64（开发验证用）
        ndk { abiFilters "arm64-v8a", "armeabi-v7a", "x86_64" }
        // AOSP 谷歌拼音解码器（搜索页拼音候选，2026-08-29）；默认 c++_static（new/delete 需要 libc++）
        // v1.19 版本重规划：内测/公测双 flavor 退役——只保留一条正式分发线（原公测版）。
        // 热更新为正式线标配；授权端点仅供用户主动访问会员/激活页面。
        // v1.18 热更新：云端下发内嵌后端 zip，启动时静默检查+预下载，下次冷启动生效
        // 2026-09-19 老板要求：**桌面应用名不带「TV版/移动版」**，两端统一 'My TV'；
        // 区分只保留在 APK 产物文件名（MyTV-TV版.apk / MyTV-移动版.apk，见文件末尾归档块）。
        // 注意：两端 label 相同，故**同一台设备不要同时装 TV 版与移动版**（靠 applicationId
        // 可以共存，但桌面会出现两个同名图标），分发时按设备类型二选一。
        resValue 'string', 'app_name', 'My TV'
        // 所有构建变体都不启用内容准入门禁；会员/激活页仍保留为用户主动访问功能。
        buildConfigField 'boolean', 'LICENSE_ENABLED', 'false'
        buildConfigField 'String', 'API_BASE_URL', apiBaseUrlConstant
        buildConfigField 'String', 'LICENSE_ENDPOINT', '"' + apiBaseUrl + '/activate"'
        buildConfigField 'boolean', 'HOTUPDATE_ENABLED', 'true'
        buildConfigField 'String', 'HOTUPDATE_ENDPOINT', '"' + apiBaseUrl + '/hotupdate"'
        buildConfigField 'String', 'IPTV_LATEST_URL', '"' + apiBaseUrl + '/iptv/latest"'
        // APK 应用内更新清单；发布时将对应清单放到静态站点的 apk-update/ 目录。
        // 联调/自测可用 -PapkUpdateUrl=<https 地址> 临时指向测试清单，不必改死代码。
        buildConfigField 'boolean', 'APK_UPDATE_ENABLED', 'true'
        buildConfigField 'String', 'APK_UPDATE_URL',
                '"' + (project.findProperty('apkUpdateUrl') ?: (apiBaseUrl + '/web/apk-update/tv.json')) + '"'
        // 启动门闸预算：TV 90s（用户要求全加载完再进，遥控场景可等）；App.kt 共享读取。
        // 2026-09-03 事故教训见 mobile 的 30000 注释
        buildConfigField 'long', 'STARTUP_GATE_MS', '90000'

        // 焦点导航仪器测试（2026-09-06 三层测试体系第二层）：自定义 Runner 换轻量
        // FocusTestApp（绕开 App.kt 的 Chaquopy 后端/许可证/启动门闸），harness 见
        // androidTest/.../focus/。真实按键注入（Espresso sendKeySync → Activity
        // .dispatchKeyEvent → OtvNav.dispatch）+ assertIsFocused 语义断言。
        testInstrumentationRunner 'com.qiubo.optimaltv.focus.FocusTestRunner'

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++14 -fexceptions"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/pinyinime/CMakeLists.txt"
            version "3.22.1"
        }
    }

    signingConfigs {
        release {
            // 发布签名（2026-08-27 生成，10 年有效期；上架商店若换自有签名须先卸载旧包）
            storeFile file("../optimaltv-release.keystore")
            storePassword releaseStorePassword
            keyAlias "optimaltv"
            keyPassword releaseKeyPassword
            // v1.39（2026-09-22）：补 v1 签名。minSdk 30 时 AGP 默认只出 v2，
            // 但投影仪定制 ROM 的包解析器/安装器常读不了 v2-only 包（表现为
            // 更新包校验反复失败、不停重新下载）；v1+v2 双签是 TV 分发的兼容底线。
            // 签名证书不变（601F…BA43），已装版本可直接覆盖升级。
            enableV1Signing = true
            enableV2Signing = true
            v1SigningEnabled = true
            v2SigningEnabled = true
        }
    }

    buildTypes {
        release {
            minifyEnabled false   // Chaquopy + 反射（引擎/Room）保守不混淆
            signingConfig signingConfigs.release
            // 所有变体都允许未激活用户进入主功能。
            buildConfigField 'boolean', 'LICENSE_ENABLED', 'false'
        }
        debug {
            // v1.20 QA：debug 也用发布签名——可覆盖安装 release（保激活/收藏等数据），
            // 模拟器经 otvDebugLicense 注码通道激活后装回 release 即可验证激活态
            signingConfig signingConfigs.release
            // Debug 必须验证 APK 内嵌的当前后端；不要让线上热更新覆盖本地测试代码。
            buildConfigField 'boolean', 'HOTUPDATE_ENABLED', 'false'
            // Debug 与 Release 一致，不启用内容准入门禁。
            buildConfigField 'boolean', 'LICENSE_ENABLED', 'false'
        }
    }

    buildFeatures { compose true; buildConfig true }
    composeOptions { kotlinCompilerExtensionVersion '1.5.14' }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    packagingOptions {
        resources { excludes += ['META-INF/{AL2.0,LGPL2.1}'] }
        // v1.8：libVLC 兜底引擎带入三 ABI so（~140MB 未压缩）——legacy 打包压缩之，
        // 代价仅首次启动多一步解压（TV 盒子一次性）
        jniLibs { useLegacyPackaging = true }
    }
}

// 后端打包进 app：Chaquopy 配置（proxy.py 只用标准库 + 自有模块，无需 pip 包）
chaquopy {
    defaultConfig {
        version = "3.11"
    }
}

// 统一产物到项目目录（v1.19 版本重规划定稿）：apk/TV版/ 固定名 MyTV-TV版.apk，
// 由 assembleRelease 复制（对外分发=签名+热更新正式链路）。
// debug 测试包不进 apk/——直接用项目根 build 构建输出目录。
tasks.register("copyTvApk", Copy) {
    from(layout.buildDirectory.file("outputs/apk/release/app-release.apk"))
    into(rootProject.file("../apk/TV版"))
    rename { "MyTV-TV版.apk" }
}
// AGP 的 assemble 任务在 android 插件注册后才出现，须在 afterEvaluate 挂接依赖
afterEvaluate {
    tasks.matching { it.name == "assembleRelease" }.configureEach { finalizedBy("copyTvApk") }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2024.06.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    // 注：androidx.tv:tv-foundation 已被上游以 Kotlin 2.1 元数据重发布，
    // 与本工程锁定工具链(Kotlin 1.9.24)不兼容；网格用 foundation LazyVerticalGrid，
    // D-pad 滚动行为一致（技术方案 §3.4 的 TvLazyVerticalGrid 等价替代）。

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.3'
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // 播放引擎层（技术方案 §3.2）：Media3 默认内核；VLC 兜底内核（直播解码失败自动切换）
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
    implementation 'androidx.media3:media3-datasource:1.5.1'
    // libVLC 兜底引擎（v1.8 2026-08-30）：自带完整 ffmpeg 软解——模拟器/个别盒子的
    // MediaCodec 全系解不动 AVC High(8x8+CABAC) 压段（SoftAVCDec Fatal 0xffffffff），
    // VLC 关闭其 mediacodec 硬解后用自带 avcodec 软解，任何设备都能出画面
    implementation 'org.videolan.android:libvlc-all:3.7.2'

    // 数据层（技术方案 §3.5）：Room 三表 + DataStore KV
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // 图片：Coil 内存/磁盘双缓存（低内存机限额见 App.kt）
    implementation 'io.coil-kt:coil-compose:2.6.0'
    // 队标 SVG 解码（football-data crests 为 svg，Coil 默认不支持）
    implementation 'io.coil-kt:coil-svg:2.6.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // v1.17 公测版：会员页购买二维码生成（BitMatrix 自绘 Canvas，无嵌入视图依赖）
    implementation 'com.google.zxing:core:3.5.3'

    // 焦点导航几何规则（NavGeom）JVM 单元测试
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16.1'

    // 焦点导航仪器测试（第二层）：Compose ui-test 的 performKeyInput 经 Espresso
    // sendKeySync 注入真按键，走 Activity.dispatchKeyEvent 全链路（与遥控器同路径）
    androidTestImplementation composeBom
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    // Espresso.pressKey = 窗口级按键注入（instrumentation.sendKeySync → Activity
    // .dispatchKeyEvent → OtvNav）；compose 的 performKeyInput 直注 Compose 层测不了引擎
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
