plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

def mihomoVersion = '1.19.32'
def mihomoDownloadsDir = layout.buildDirectory.dir('generated/football-vpn-assets/mihomo')
def mihomoJniLibsDir = layout.buildDirectory.dir('generated/football-vpn-jni')
def mihomoArtifacts = [
        'arm64-v8a': [
                file: "mihomo-android-arm64-v8-v${mihomoVersion}.gz",
                sha256: '42b1f2be8702484d3ae6238daab392622f54bd0d264966700f1f28f52596e326',
        ],
        'armeabi-v7a': [
                file: "mihomo-android-armv7-v${mihomoVersion}.gz",
                sha256: 'cbac13a26ab77ce80871a064783a02246a856a20ab7435fe301fa1665e99acf4',
        ],
        'x86_64': [
                file: "mihomo-android-amd64-v${mihomoVersion}.gz",
                sha256: '91c159015e7d8aaff22153b9fd18749a0c7258d6f252ea344ecace975ce17413',
        ],
]

def downloadMihomo = tasks.register('downloadFootballVpnCores') {
    inputs.property('mihomoVersion', mihomoVersion)
    inputs.property('mihomoArtifacts', mihomoArtifacts.collectEntries { abi, artifact -> [(abi): artifact.sha256] })
    outputs.dir(mihomoDownloadsDir)
    outputs.dir(mihomoJniLibsDir)
    doLast {
        File downloadsDir = mihomoDownloadsDir.get().asFile
        File jniLibsDir = mihomoJniLibsDir.get().asFile
        downloadsDir.mkdirs()
        jniLibsDir.mkdirs()
        mihomoArtifacts.each { abi, artifact ->
            File archive = new File(downloadsDir, "${abi}.bin")
            if (!archive.isFile() || !sha256(archive).equalsIgnoreCase(artifact.sha256)) {
                File temporary = new File(downloadsDir, "${abi}.bin.download")
                String url = "https://github.com/MetaCubeX/mihomo/releases/download/v${mihomoVersion}/${artifact.file}"
                String actual = 'unavailable'
                boolean downloaded = false
                for (int attempt = 1; attempt <= 3 && !downloaded; attempt++) {
                    temporary.delete()
                    try {
                        URLConnection connection = new URL(url).openConnection()
                        connection.connectTimeout = 20000
                        connection.readTimeout = 60000
                        if (connection instanceof HttpURLConnection && connection.responseCode != 200) {
                            throw new IOException("HTTP ${connection.responseCode}")
                        }
                        connection.inputStream.withCloseable { input ->
                            temporary.withOutputStream { output -> input.transferTo(output) }
                        }
                        actual = sha256(temporary)
                        if (actual.equalsIgnoreCase(artifact.sha256)) {
                            downloaded = true
                        }
                    } catch (Exception ignored) {
                        actual = 'download failed'
                    }
                    if (!downloaded && attempt < 3) Thread.sleep(attempt * 1000L)
                }
                if (!downloaded) {
                    temporary.delete()
                    throw new GradleException("Mihomo ${abi} download/checksum failed (actual: ${actual})")
                }
                if (!temporary.renameTo(archive)) {
                    archive.bytes = temporary.bytes
                    temporary.delete()
                }
            }

            File abiDir = new File(jniLibsDir, abi)
            File target = new File(abiDir, 'libmihomo.so')
            abiDir.mkdirs()
            File unpacked = new File(abiDir, 'libmihomo.so.tmp')
            new java.util.zip.GZIPInputStream(archive.newInputStream()).withCloseable { input ->
                unpacked.withOutputStream { output -> input.transferTo(output) }
            }
            if (target.exists() && !target.delete()) {
                throw new GradleException("Could not replace Mihomo ${abi} library")
            }
            if (!unpacked.renameTo(target)) {
                target.bytes = unpacked.bytes
                unpacked.delete()
            }
            target.setExecutable(true, false)
        }
    }
}

String sha256(File file) {
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        byte[] buffer = new byte[65536]
        int count
        while ((count = input.read(buffer)) > 0) digest.update(buffer, 0, count)
    }
    return digest.digest().collect { String.format('%02x', it & 0xff) }.join()
}

android {
    namespace 'com.qiubo.optimaltv.vpn'
    compileSdk 35

    defaultConfig { minSdk 30 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    sourceSets.main.jniLibs.srcDir(mihomoJniLibsDir)
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

tasks.named('preBuild').configure { dependsOn(downloadMihomo) }
