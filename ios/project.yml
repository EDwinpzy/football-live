name: FootballLive
options:
  bundleIdPrefix: com.qiubo
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.4"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "7"
targets:
  FootballLive:
    type: application
    platform: iOS
    sources:
      - path: FootballLive
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qiubo.mytv.ios
        PRODUCT_NAME: FootballLive
        INFOPLIST_FILE: FootballLive/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  FootballLiveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FootballLiveTests
    dependencies:
      - target: FootballLive
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  FootballLiveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FootballLiveUITests
    dependencies:
      - target: FootballLive
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FootballLive:
    build:
      targets:
        FootballLive: all
    test:
      targets:
        - FootballLiveTests
        - FootballLiveUITests
      gatherCoverageData: false
