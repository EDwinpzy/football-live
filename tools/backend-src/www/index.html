<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<meta name="mobile-web-app-capable" content="yes">
<title>足球直播</title>
<link rel="icon" href="assets/logo.png">
<link rel="apple-touch-icon" href="assets/logo.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css?v=134">
</head>
<body>
<header class="app-header" id="appHeader">
  <a class="brand" href="index.html" aria-label="足球直播首页">
    <span class="brand-ball" aria-hidden="true">⚽</span>
    <span class="brand-copy"><strong>足球直播</strong><small>赛程 · 多线路直播</small></span>
  </a>
  <div class="header-tools">
    <span id="updateStatus" class="update-status" hidden></span>
    <button id="updateButton" class="header-button" type="button" hidden>检查更新</button>
    <button id="refreshButton" class="header-button primary" type="button" aria-label="刷新赛程">刷新赛程</button>
  </div>
</header>

<main class="page" id="pLive">
  <section class="hero" id="liveHero" hidden aria-label="焦点比赛">
    <img class="hero-image" id="liveHeroImg" alt="">
    <div class="hero-shade"></div>
    <div class="hero-copy">
      <div class="hero-kicker"><span class="live-dot"></span><span id="heroLeague">足球直播</span></div>
      <div class="hero-teams" id="heroTeams"></div>
      <div class="hero-status" id="heroStatus"></div>
      <button id="heroWatch" class="watch-button" type="button">▶ <span>观看直播</span></button>
    </div>
    <div class="hero-dots" id="heroDots" aria-label="焦点比赛选择"></div>
  </section>

  <section class="matches-section" aria-label="足球比赛">
    <div class="section-heading">
      <div><p class="eyebrow">MATCH CENTER</p><h1>比赛赛程</h1></div>
      <div class="live-count" id="liveCount">赛程更新中</div>
    </div>
    <nav class="league-filters" id="leagueChips" aria-label="按联赛筛选"></nav>
    <div id="liveLoading" class="loading-state" role="status">正在加载比赛赛程…</div>
    <div id="liveSections"></div>
  </section>
</main>

<div class="hint" id="hint" hidden role="status" aria-live="polite"></div>

<section class="player" id="player" hidden role="dialog" aria-modal="true" aria-label="足球直播播放器">
  <header class="player-header">
    <div class="player-heading"><strong id="playerTitle">足球直播</strong><span id="playerMeta"></span></div>
    <button id="playerClose" class="close-button" type="button" aria-label="关闭播放器">✕</button>
  </header>
  <div class="player-stage">
    <video id="video" playsinline webkit-playsinline controls preload="none"></video>
    <div class="player-spinner" id="playerSpinner" hidden></div>
    <div class="player-error" id="playerError" hidden>
      <p id="playerErrorText">当前线路暂不可用</p>
      <button id="playerRetry" class="header-button primary" type="button">重试线路</button>
    </div>
  </div>
  <div class="source-area">
    <div class="source-heading"><div><p class="eyebrow">LIVE SIGNALS</p><h2>直播信号源</h2></div><span id="sourceState" role="status"></span></div>
    <div class="source-list" id="srcPicker"></div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js" defer onerror="window.__hlsFail=1"></script>
<script src="app.js?v=137" defer></script>
</body>
</html>
