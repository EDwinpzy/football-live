<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E0E0F">
<meta name="mobile-web-app-capable" content="yes">
<title>My TV</title>
<link rel="icon" href="assets/logo.png">
<link rel="apple-touch-icon" href="assets/logo.png">
<link rel="stylesheet" href="style.css?v=131">
</head>
<body>

<!-- 顶部 tab 胶囊（MainTabBar 复刻：足球/影视/电视/我的 + 搜索） -->
<div id="tabpill">
  <button class="tab on" data-tab="live">足球</button>
  <button class="tab" data-tab="vod">影视</button>
  <button class="tab" data-tab="tv">电视</button>
  <button class="tab" data-tab="fav">我的</button>
  <button class="tab-search" data-tab="search" title="搜索">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
  </button>
</div>

<div id="hint" class="otv-hint" hidden></div>

<!-- ============ 足球（LiveScreen 复刻） ============ -->
<div class="page" id="pLive">
  <div class="hero-band" id="liveHero">
    <img class="hero-img" id="liveHeroImg" alt="">
    <div class="hero-fog"></div><div class="hero-left"></div><div class="hero-fade"></div>
    <div class="live-hero-content">
      <div class="score-row" id="liveScoreRow"></div>
      <div class="sp24"></div>
      <div class="live-status" id="liveStatus"></div>
    </div>
    <button class="cta-watch" id="liveCta">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span>立即观看</span>
    </button>
    <div class="hero-dots live-dots" id="liveDots"></div>
  </div>
  <div class="hscroll league-chips" id="leagueChips"></div>
  <div id="liveSections"></div>
  <div class="page-loading" id="liveLoading">— 加载比赛数据中 …</div>
</div>

<!-- ============ 影视首页（HomeScreen/VodScreen 复刻） ============ -->
<div class="page" id="pVod" hidden>
  <div class="hero-band vod-hero" id="vodHero">
    <img class="hero-img" id="vodHeroImg" alt="">
    <div class="hero-fog"></div><div class="hero-left"></div><div class="hero-fade"></div>
    <div class="vod-hero-content">
      <div class="hero-title" id="vodHeroTitle"></div>
      <div class="sp8"></div>
      <div class="hero-meta-row" id="vodHeroMeta"></div>
      <div class="sp10"></div>
      <div class="hero-desc" id="vodHeroDesc"></div>
    </div>
    <!-- 播放钮：2026-09-19 从文字列内移出，固定在带底设计位（同 App：钮不再被长简介顶出带外） -->
    <button class="btn-play-hero" id="vodHeroPlay">立即播放</button>
    <div class="hero-dots vod-dots" id="vodDots"></div>
  </div>
  <div id="histRow"></div>
  <div class="cat-chips" id="catChips"></div>
  <div id="vodSections"></div>
  <div class="page-loading" id="vodLoading">— 加载中 …</div>
</div>

<!-- ============ 电视（TvScreen 浏览态复刻：分组 chips + 频道网格） ============ -->
<div class="page" id="pTv" hidden>
  <div class="tv-browse">
    <div class="hscroll tv-group-chips" id="tvGroupChips"></div>
    <div class="sp26" id="tvSp"></div>
    <div class="tv-grid" id="tvChannels"></div>
    <div class="page-loading" id="tvLoading">— 频道表加载中 …</div>
  </div>
</div>

<!-- ============ 我的（FavoritesScreen 复刻：topPad150 收藏 + 历史；会员卡置顶） ============ -->
<div class="page" id="pFav" hidden>
  <div class="fav-body">
    <div class="fav-title-row">
      <div class="fav-sec-title">我的收藏</div>
      <!-- 会员信息行：与 App `MemberInlineInfo` 同构——状态点 + 「状态 · 套餐/到期/剩余」，
           无背景框；行尾「续费」胶囊开会员弹窗（App 同位置也是「续费」入口）。
           未激活时本行整体隐藏，与 App「未激活走统一会员页」一致。 -->
      <div class="member-inline" id="memberInline" hidden></div>
    </div>
    <div class="fav-empty" id="favEmpty" hidden>暂无收藏</div>
    <div class="hscroll fav-row" id="favRow"></div>
    <div id="favHistSec">
      <div class="fav-sec-title hist">历史记录</div>
      <div class="fav-empty" id="favHistEmpty" hidden>暂无观看记录</div>
      <div class="hscroll fav-row" id="histRowFav"></div>
    </div>
  </div>
</div>

<!-- ============ 搜索（SearchScreen 复刻：页底 #2C2C2E） ============ -->
<div class="page search-page" id="pSearch" hidden>
  <div class="search-body">
    <div class="search-input-row">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      <input id="searchInput" placeholder="Search" autocomplete="off">
      <button id="searchClear" hidden>清空</button>
    </div>
    <div class="search-tabs" id="searchTabs"></div>
    <div class="search-grid" id="searchGrid"></div>
    <div class="page-loading" id="searchHint" hidden></div>
  </div>
</div>

<!-- ============ 全部影视（AllScreen 复刻：推送页，无 tab 栏；类别在筛选面板首行） ============ -->
<div class="push-page" id="pAll" hidden>
  <button class="back-btn">‹</button>
  <div class="all-body">
    <div class="filter-panel" id="filterPanel"></div>
    <div class="poster-grid" id="allGrid"></div>
    <div class="all-more" id="allMore" hidden>加载更多…</div>
  </div>
</div>

<!-- ============ 详情（DetailScreen 复刻：推送页） ============ -->
<div class="push-page" id="pDetail" hidden>
  <button class="back-btn">‹</button>
  <div class="detail-body">
    <div class="detail-center">
      <div class="detail-row">
        <div class="detail-poster">
          <img id="dPoster" alt="">
          <img id="dDouban" alt="" hidden>
          <div class="dp-fade"></div>
        </div>
        <div class="detail-info">
          <div class="d-title" id="dTitle"></div>
          <div class="sp12"></div>
          <div class="d-meta-row"><span class="d-meta" id="dMeta"></span><span class="d-score" id="dScore"></span></div>
          <div class="sp10"></div>
          <div class="d-actors" id="dActors"></div>
          <div class="sp12"></div>
          <div class="d-desc" id="dDesc"></div>
          <div class="sp14"></div>
          <div class="d-resume" id="dResume"></div>
          <div class="sp14"></div>
          <div class="d-buttons" id="dButtons"></div>
          <div class="sp24"></div>
          <div class="d-eps-wrap" id="dEpsWrap" hidden>
            <div class="d-ep-pages" id="dEpPages"></div>
            <div class="d-ep-grid" id="dEpGrid"></div>
          </div>
          <div class="sp22"></div>
          <div class="d-lines-row" id="dLinesRow">
            <div class="d-lines-title" id="dLinesTitle"></div>
            <div class="hscroll d-lines" id="dLines"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ============ 播放器（PlayerScreen 复刻：全屏沉浸） ============ -->
<div id="pPlayer" hidden>
  <video id="video" playsinline webkit-playsinline></video>
  <div id="bufSpin" class="buf-spin" hidden></div>
  <div id="gestInd" hidden></div>
  <!-- 返回钮（控制条/信号源条可见时左上角；App MobileBackButton 44dp） -->
  <button id="ctlBack" hidden>‹</button>
  <!-- 更多钮（右上角，App CircleButton 52dp） -->
  <button id="moreBtn" hidden>
    <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.6"/><circle cx="12" cy="12" r="2.6"/><circle cx="12" cy="19" r="2.6"/></svg>
  </button>
  <!-- 更多面板全屏暗区（App 0x66000000 点按关闭） -->
  <div id="moreDim" hidden></div>
  <!-- 控制层（影视：点按呼出；直播不出） -->
  <div id="controls" hidden>
    <div class="ctl-bottom">
      <div class="ctl-title" id="cTitle"></div>
      <div class="ctl-meta" id="cMeta"></div>
      <div class="sp26"></div>
      <div class="ctl-progress-row">
        <button id="cPlayBtn" class="ctl-play">
          <svg id="cPlayIco" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <span class="ctl-time" id="cPos">00:00</span>
        <div class="ctl-track" id="cTrack"><div class="ctl-rail"><div class="ctl-fill" id="cFill"><div class="ctl-thumb"></div></div></div></div>
        <span class="ctl-time" id="cDur">-00:00</span>
        <button id="ctlFull" class="ctl-full" title="全屏播放">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3H4zm11-5h5v5h-2V6h-3V4zM4 15h2v3h3v2H4v-5zm14 0h2v5h-5v-2h3v-3z"/></svg>
        </button>
      </div>
    </div>
  </div>
  <!-- 更多面板（MorePanel 复刻：右侧 560dp 悬浮栏 / 竖屏 92vw） -->
  <div id="morePanel" hidden>
    <div class="mp-inner">
      <div class="mp-info-row">
        <img class="mp-poster" id="mpPoster" alt="">
        <div class="mp-info">
          <div class="mp-title" id="mpTitle"></div>
          <div class="mp-meta" id="mpMeta"></div>
          <div class="mp-line" id="mpLine"></div>
        </div>
      </div>
      <div class="mp-desc" id="mpDesc"></div>
      <div id="mpEpsWrap" hidden>
        <div class="mp-sec">选集</div>
        <div class="hscroll mp-ep-pages" id="mpEpPages"></div>
        <div class="mp-ep-grid" id="mpEpGrid"></div>
      </div>
      <div id="mpLinesSec">
        <div class="mp-sec">换源线路</div>
        <div class="hscroll mp-chips" id="mpLines"></div>
      </div>
      <div class="mp-sec">倍速</div>
      <div class="hscroll mp-chips" id="mpSpeed"></div>
      <div class="mp-sec">画幅</div>
      <div class="hscroll mp-chips" id="mpAspect"></div>
    </div>
  </div>
  <!-- 播放错误态（App ErrorWidget：卡片 + 标题 + 说明） -->
  <div id="pError" hidden>
    <div class="pe-card">
      <div class="pe-title">无法播放</div>
      <div class="pe-msg" id="peMsg"></div>
      <div class="pe-sub">已尝试全部线路。可重试或返回选择其他影片。</div>
      <div class="pe-actions">
        <button id="peRetry">重试</button>
        <button id="peBack">返回</button>
      </div>
    </div>
  </div>
  <!-- 直播信号源选择条（App LiveSourcePicker：底部居中胶囊卡） -->
  <div id="srcPickerWrap" hidden>
    <div class="src-picker" id="srcPicker"></div>
  </div>
</div>

<!-- 会员付费墙（App PaywallScreen/ActivateScreen 网页对应物：播放门控） -->
<div id="paywall" hidden>
  <div class="pw-card">
    <div class="pw-title">My TV · 会员服务</div>
    <div class="pw-sub" id="pwSub">开通会员后可观看全部影视与直播内容</div>
    <div class="pw-form">
      <input id="pwInput" placeholder="卡密 OTV-XXXXX-XXXXX" autocomplete="off" spellcheck="false">
      <button id="pwBtn">激活</button>
    </div>
    <div class="pw-msg" id="pwMsg"></div>
    <button class="pw-close" id="pwClose">暂不开通</button>
  </div>
</div>

<!-- 会员续费 / 兑换弹窗（2026-09-19 需求④：网页版顶部新增续费窗口） -->
<div id="memberModal" hidden>
  <div class="mm-card">
    <div class="mm-head">
      <div>
        <div class="mm-title">会员</div>
        <div class="mm-sub" id="mmSub"></div>
      </div>
      <button class="mm-close" id="mmClose" title="关闭">✕</button>
    </div>
    <div class="mm-plans" id="mmPlans"></div>
    <div class="mm-redeem">
      <input id="mmInput" placeholder="卡密 OTV-XXXXX-XXXXX" autocomplete="off" spellcheck="false">
      <button id="mmBtn">兑换</button>
    </div>
    <div class="mm-msg" id="mmMsg"></div>
    <div class="mm-tip">续费：购买新卡密后用同一入口兑换，有效期在现有到期时间上顺延。</div>
  </div>
</div>

<!-- 电视播放态（全屏 + 圆形 FAB + 两级侧边栏） -->
<div id="tvPlay" hidden>
  <video id="tvVideo" playsinline webkit-playsinline></video>
  <div id="tvBuf" class="buf-spin" hidden></div>
  <div id="tvErr" hidden><div class="pe-msg" id="tvErrMsg"></div></div>
  <!-- 选台钮（2026-09-05 视觉稿定稿）：左缘贴边窄竖条（图标 + 竖排「选台」） -->
  <button id="tvFab" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round">
      <rect x="4" y="5" width="16" height="14" rx="2.5"/><path d="M8 9.5h8M8 13h5"/>
    </svg>
    <b>选台</b>
  </button>
  <div id="tvSidebar" hidden>
    <div class="tvs-groups" id="tvsGroups"></div>
    <div class="tvs-chans">
      <div id="tvsList"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js" defer onerror="window.__hlsFail=1"></script>
<script src="app.js?v=133" defer></script>
</body>
</html>
