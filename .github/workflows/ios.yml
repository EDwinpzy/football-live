name: iOS native build
on:
  workflow_dispatch:
  push:
    branches: [codex/ios-native-free]
    paths: ["ios/**", ".github/workflows/ios.yml"]
permissions:
  contents: read
concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          python3 -m unittest discover -s ios/scripts -p 'test_*.py' -v
          brew install xcodegen
          xcodegen generate --spec ios/project.yml --project ios
      - name: Select and boot iPhone simulator
        run: |
          xcrun simctl list devices available --json > /tmp/ios-devices.json
          DEVICE_ID=$(python3 -c 'import json; d=json.load(open("/tmp/ios-devices.json")); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if "iPhone" in v["name"]))')
          echo "IOS_DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl keychain "$DEVICE_ID" add-root-cert ios/Certificates/MyTV-Root-CA.cer
      - name: Diagnose real service connectivity with standard TLS
        run: |
          mkdir -p ios/build/delivery
          if curl --connect-timeout 15 --max-time 25 --cacert android/app/src/main/res/raw/mytv_migration_ca.pem \
            --fail --show-error 'https://103.236.97.137:35208/web/vod/home?category=movie' \
            -o ios/build/delivery/live-home.json 2>ios/build/delivery/live-network.log; then
            echo 'MYTV_LIVE_AVAILABLE=1' >> "$GITHUB_ENV"
          else
            echo 'MYTV_LIVE_AVAILABLE=0' >> "$GITHUB_ENV"
            cat ios/build/delivery/live-network.log
            echo '::warning::Cloud runner cannot reach the real service. Live UI acceptance remains unverified; deterministic native tests still run.'
            echo 'Live service UI test excluded: cloud network preflight failed. See live-network.log; phone network/playback remains unverified.' > ios/build/delivery/LIVE-ACCEPTANCE.txt
          fi
      - name: Native unit, UI, and live API tests
        run: |
          set -o pipefail
          mkdir -p ios/build/delivery
          LIVE_TEST_ARGS=()
          if [ "$MYTV_LIVE_AVAILABLE" != '1' ]; then
            LIVE_TEST_ARGS=(-skip-testing:MyTVUITests/MyTVUITests/testRealServiceHomeLoadsWithoutActivationAndCapturesPortrait)
          fi
          xcodebuild test -project ios/MyTV.xcodeproj -scheme MyTV \
            -destination "platform=iOS Simulator,id=$IOS_DEVICE_ID" \
            -parallel-testing-enabled NO -resultBundlePath ios/build/Tests.xcresult \
            "${LIVE_TEST_ARGS[@]}" \
            CODE_SIGNING_ALLOWED=NO | tee ios/build/delivery/tests.log
      - name: Build unsigned device app for local free-account signing
        run: |
          set -o pipefail
          xcodebuild build -project ios/MyTV.xcodeproj -scheme MyTV -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath ios/build/Device \
            CODE_SIGNING_ALLOWED=NO | tee ios/build/delivery/build.log
          python3 ios/scripts/package_ipa.py ios/build/Device/Build/Products/Release-iphoneos/MyTV.app ios/build/delivery/MyTV-unsigned.ipa
          cp ios/Certificates/MyTV-Root-CA.mobileconfig ios/build/delivery/
          cd ios/build/delivery
          shasum -a 256 MyTV-unsigned.ipa MyTV-Root-CA.mobileconfig > SHA256SUMS
      - name: Extract screenshots
        if: always()
        run: |
          if [ -d ios/build/Tests.xcresult ]; then
            mkdir -p ios/build/delivery/screenshots
            xcrun xcresulttool export attachments --path ios/build/Tests.xcresult --output-path ios/build/delivery/screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MyTV-iOS
          path: ios/build/delivery/
          retention-days: 1
          if-no-files-found: error
