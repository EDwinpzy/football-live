log_format football_live '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
access_log /dev/stdout football_live;
error_log /dev/stderr warn;

server {
    listen 8080;
    server_name _;
    client_max_body_size 200m;

    location = /health {
        proxy_pass http://health:8080/health;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate /run/secrets/server.crt;
    ssl_certificate_key /run/secrets/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FOOTBALL_LIVE_TLS:10m;
    ssl_session_timeout 1d;

    client_max_body_size 200m;
    client_body_timeout 120s;
    send_timeout 120s;

    location = /health {
        proxy_pass http://health:8080/health;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_set_header Host $host;
    }

    location = /hotupdate {
        proxy_pass http://business-api:8082/hotupdate;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /hotupdate/ {
        proxy_pass http://business-api:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /v1/storages/object/ {
        proxy_pass http://storage:8092;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /web {
        return 308 /web/;
    }

    location ^~ /web/ {
        proxy_pass http://web-api:8090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}
